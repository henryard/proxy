name: Update IconSet JSON

# IconSet 文件夹下有文件变化（新增/删除/改名图片）时自动触发
# 也支持在 Actions 页面手动点击运行（workflow_dispatch）
on:
  push:
    branches: [main]        # 如果你的默认分支是 master，把这里改成 master
    paths:
      - 'IconSet/**'
  workflow_dispatch: {}

permissions:
  contents: write            # 允许该 workflow 用自带的 GITHUB_TOKEN 提交/推送

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成图标库 JSON
        run: node scripts/generate-iconset-json.js

      - name: 提交并推送变更（无变化则自动跳过）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新 IconSet.json"
          file_pattern: IconSet.json
